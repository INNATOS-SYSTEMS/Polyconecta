<div class="o_control_panel">
    <div class="d-flex align-items-center gap-3">
        <pc-boton-nuevo [ruta]="'/calidad'" />
        <pc-odoo-breadcrumb [items]="[{ label: 'Control de Calidad' }]" />
    </div>
    <pc-odoo-search-panel [view]="vista" [(texto)]="searchText" [(filtrosActivos)]="filtros" [(agrupacionesActivas)]="agrupaciones"
                          [permiteAgrupar]="viewState.viewMode() !== 'Kanban'" [conFavoritos]="viewState.viewMode() !== 'Kanban'"
                          [favoritos]="lista()?.favoritos() ?? []" (guardarFavorito)="lista()?.guardarFavorito($event.nombre, $event.porOmision)"
                          (aplicarFavorito)="lista()?.aplicarFavorito($event)" (borrarFavorito)="lista()?.borrarFavorito($event)" >
      <pc-odoo-seleccion [lista]="tabla()" />
    </pc-odoo-search-panel>
    <div class="d-flex align-items-center gap-2">
        <pc-odoo-view-switcher />
    </div>
</div>

<div class="p-4">
    @if (viewState.viewMode() === 'Kanban') {
        <pc-odoo-kanban #kanban [origen]="origen" campoEtapa="estado" [etapas]="etapas" [tarjeta]="tarjeta"
                        [idDe]="idControl" [etapaDe]="etapaControl" [nombrados]="filtros()" [busqueda]="searchText()" (abrir)="abrir($event)" />
        <ng-template #tarjeta let-f>
            <div class="o_kanban_card_cabecera">
                <div class="fw-semibold text-dark small">{{ f.folio }}</div>
                <span class="badge badge-brand">{{ f.estado }}</span>
            </div>
            <div class="text-muted small">{{ f.libre ? 'Control libre' : producto(f.producto) }}</div>
            @if (!f.libre) {
                <div class="o_kanban_card_dato"><pc-odoo-icon nombre="fabricacion" />{{ f.orden }} · {{ f.proceso }}</div>
            }
            <div class="o_kanban_card_dato"><pc-odoo-icon nombre="lotes" />{{ f.lotes }} lote(s)@if (f.enRevision > 0) { · {{ f.enRevision }} en revisión}</div>
        </ng-template>
        <pc-odoo-pager [count]="kanban.total()" />
    } @else {
        <pc-odoo-list lista="calidad.controles" [origen]="origen" [columnas]="columnas" [idDe]="idControl" mensajeVacio=""
                      [(busqueda)]="searchText" [(nombrados)]="filtros" [(agruparPor)]="agrupaciones" (abrir)="abrir($event)" />
    }
</div>
