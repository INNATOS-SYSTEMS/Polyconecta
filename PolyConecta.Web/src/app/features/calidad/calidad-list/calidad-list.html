<div class="o_control_panel">
    <div class="d-flex align-items-center gap-3">
        <button class="btn btn-primary btn-sm fw-bold px-3" disabled="disabled" title="Alta manual deshabilitada en esta demo: las fichas de Calidad nacen de la Orden de Fabricación">
            <i class="bi bi-plus-lg me-1"></i> Nuevo
        </button>
        <pc-odoo-breadcrumb [items]="[{ label: 'Control de Calidad' }]" />
    </div>
    <pc-odoo-search-panel [view]="vista" [(texto)]="searchText" [(filtrosActivos)]="filtros" />
    <div class="d-flex align-items-center gap-2">
        <div class="btn-group btn-group-sm o_view_switcher">
            <button class="btn-view active" disabled><i class="bi bi-list-ul"></i></button>
        </div>
    </div>
</div>

<div class="p-4">
    <table class="table table-hover align-middle bg-white shadow-sm">
        <thead class="table-light">
            <tr>
                <th style="width:36px;"><input type="checkbox" class="form-check-input" (change)="toggleAll($event)" /></th>
                <th>Folio</th>
                <th>Producto</th>
                <th>Orden de Fabricación</th>
                <th>Proceso</th>
                <th class="text-end">Lotes</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            @for (of of filteredOrders(); track of.folio) {
                <tr style="cursor:pointer;" [class.table-active]="selected().has(of.folio)" (click)="router.navigateByUrl('/calidad/' + of.folio)">
                    <td (click)="$event.stopPropagation()"><input type="checkbox" class="form-check-input" [checked]="selected().has(of.folio)" (change)="toggleOne(of.folio)" /></td>
                    <td class="fw-semibold text-primary">{{ qcFolio(of.folio) }}</td>
                    <td>{{ of.producto }}</td>
                    <td>{{ of.folio }}</td>
                    <td>{{ of.processLabel }}</td>
                    <td class="text-end">{{ of.produccion.length }}</td>
                    <td><span class="badge badge-brand">{{ estadoQc(of) }}</span></td>
                </tr>
            }
        </tbody>
    </table>
    <pc-odoo-pager [count]="filteredOrders().length" />
</div>
