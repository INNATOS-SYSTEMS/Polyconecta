<div class="o_control_panel">
    <div class="d-flex align-items-center gap-3">
        <pc-boton-nuevo [ruta]="'/recolecciones'" />
        <pc-odoo-breadcrumb [items]="[{ label: 'Recolecciones' }]" />
    </div>
    <pc-odoo-search-panel [view]="vista" [(texto)]="searchText" [(filtrosActivos)]="filtros" [(agrupacionesActivas)]="agrupaciones"
                          [permiteAgrupar]="viewState.viewMode() !== 'Kanban'" [conFavoritos]="viewState.viewMode() !== 'Kanban'"
                          [favoritos]="lista()?.favoritos() ?? []" (guardarFavorito)="lista()?.guardarFavorito($event.nombre, $event.porOmision)"
                          (aplicarFavorito)="lista()?.aplicarFavorito($event)" (borrarFavorito)="lista()?.borrarFavorito($event)" />
    <div class="d-flex align-items-center gap-2">
        <pc-odoo-view-switcher />
    </div>
</div>

<div class="p-4">
    @if (viewState.viewMode() === 'Kanban') {
        <pc-odoo-kanban #kanban [origen]="origen" campoEtapa="estado" [etapas]="etapas" [transiciones]="transiciones" [tarjeta]="tarjeta"
                        [idDe]="idRecoleccion" [etapaDe]="etapaRecoleccion" [nombrados]="filtros()" [busqueda]="searchText()" (abrir)="abrir($event)" />
        <ng-template #tarjeta let-f>
            <div class="o_kanban_card_cabecera">
                <div class="fw-semibold text-dark small">{{ f.folio }}</div>
                <span class="badge badge-brand">{{ f.estado }}</span>
            </div>
            <div class="text-muted small">{{ f.operacion }}@if (f.backorder) { · backorder}</div>
            <div class="o_kanban_card_dato"><pc-odoo-icon nombre="traslado" />{{ f.origen }} → {{ f.destino }}</div>
            @if (f.orden) {
                <div class="o_kanban_card_dato"><pc-odoo-icon nombre="fabricacion" />{{ f.orden }}</div>
            }
            <div class="o_kanban_card_dato"><pc-odoo-icon nombre="calendario" />Fecha límite: {{ fechaCampo(f.fechaLimite) }}</div>
        </ng-template>
        <pc-odoo-pager [count]="kanban.total()" />
    } @else {
        <pc-odoo-list lista="logistica.recolecciones" [origen]="origen" [columnas]="columnas()" [idDe]="idRecoleccion" mensajeVacio=""
                      [(busqueda)]="searchText" [(nombrados)]="filtros" [(agruparPor)]="agrupaciones" (abrir)="abrir($event)" />
    }
</div>

<!-- El remanente de una validación parcial lleva la insignia "backorder". En una línea: Razor recorta los espacios. -->
<ng-template #celdaFolio let-f>{{ f.folio }}@if (f.backorder) {<span class="badge bg-secondary-subtle text-secondary-emphasis ms-1" style="font-size:.65rem;">backorder</span>}</ng-template>
