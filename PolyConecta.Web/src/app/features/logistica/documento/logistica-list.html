<div class="o_control_panel">
    <div class="d-flex align-items-center gap-3">
        <pc-boton-nuevo [ruta]="cfg().ruta" />
        <pc-odoo-breadcrumb [items]="[{ label: cfg().tituloLista }]" />
    </div>
    <pc-odoo-search-panel [view]="cfg().vista" [(texto)]="searchText" [(filtrosActivos)]="filtros" />
    <div class="d-flex align-items-center gap-2">
        <div class="btn-group btn-group-sm o_view_switcher">
            <button class="btn-view active" disabled><i class="bi bi-list-ul"></i></button>
        </div>
    </div>
</div>

<div class="p-4">
    <table class="table table-hover align-middle bg-white shadow-sm">
        <thead class="table-light">
            <tr>
                <th style="width:36px;"><input type="checkbox" class="form-check-input" (change)="toggleAll($event)" /></th>
                <th>Folio</th><th>Operación</th>@if (cfg().mostrarOrigenEnLista) {<th>Origen</th>}<th>Destino</th><th>Estado</th>
            </tr>
        </thead>
        <tbody>
            @for (f of filas(); track f.folio) {
                <tr style="cursor:pointer;" [class.table-active]="seleccionadas().has(f.folio)" (click)="router.navigateByUrl(cfg().ruta + '/' + f.folio)">
                    <td (click)="$event.stopPropagation()"><input type="checkbox" class="form-check-input" [checked]="seleccionadas().has(f.folio)" (change)="toggle(f.folio)" /></td>
                    <td class="fw-semibold text-primary">{{ f.folio }}</td>
                    <td>{{ f.operacion }}</td>
                    @if (cfg().mostrarOrigenEnLista) {
                    <td>{{ f.origen }}</td>
                    }
                    <td>{{ f.destino }}</td>
                    <td><span class="badge badge-brand">{{ f.estado }}</span></td>
                </tr>
            }
        </tbody>
    </table>
    <pc-odoo-pager [count]="filas().length" />
</div>
