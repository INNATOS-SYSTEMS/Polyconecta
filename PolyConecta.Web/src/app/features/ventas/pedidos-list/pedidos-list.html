<div class="o_control_panel">
    <div class="d-flex align-items-center gap-3">
        <pc-boton-nuevo [ruta]="'/pedidos'" />
        <pc-odoo-breadcrumb [items]="[{ label: 'Pedidos' }]" />
    </div>
    <pc-odoo-search-panel [view]="vista" [(texto)]="searchText" [(filtrosActivos)]="filtros" [(agrupacionesActivas)]="agrupaciones"
                          [permiteAgrupar]="viewState.viewMode() !== 'Kanban'" [conFavoritos]="viewState.viewMode() !== 'Kanban'"
                          [favoritos]="lista()?.favoritos() ?? []" (guardarFavorito)="lista()?.guardarFavorito($event.nombre, $event.porOmision)"
                          (aplicarFavorito)="lista()?.aplicarFavorito($event)" (borrarFavorito)="lista()?.borrarFavorito($event)" />
    <div class="d-flex align-items-center gap-2">
        <pc-odoo-view-switcher />
    </div>
</div>

<div class="p-4">
    @if (viewState.viewMode() === 'Kanban') {
        <pc-odoo-kanban #kanban [origen]="origen" campoEtapa="estado" [etapas]="etapas" [transiciones]="transiciones" [tarjeta]="tarjeta"
                        [idDe]="idPedido" [etapaDe]="etapaPedido" [nombrados]="filtros()" [busqueda]="searchText()" (abrir)="abrir($event)" />
        <ng-template #tarjeta let-f>
            <div class="fw-bold text-dark small">{{ f.folio }}</div>
            <div class="text-muted small">{{ f.cliente }}</div>
            <div class="text-muted small mt-1"><pc-odoo-icon nombre="paquete" />{{ f.producto }}</div>
            <div class="badge badge-brand mt-2">{{ f.estado }}</div>
        </ng-template>
        <pc-odoo-pager [count]="kanban.total()" />
    } @else {
        <pc-odoo-list lista="ventas.pedidos" [origen]="origen" [columnas]="columnas" [idDe]="idPedido" mensajeVacio=""
                      [(busqueda)]="searchText" [(nombrados)]="filtros" [(agruparPor)]="agrupaciones" (abrir)="abrir($event)" />
    }
</div>
