@if (!cargando()) {
  <pc-hoja-registro lista="Grupos" ruta="/plataforma/grupos" titulo="Grupo" tipo="plataforma.grupo"
                    [nombre]="guardado()?.nombre ?? ''" [nuevo]="nuevo" [sucio]="sucio()" [guardando]="guardando()" [error]="error()"
                    [acciones]="acciones()" [botones]="botones()" [id]="guardado()?.id ?? null" (guardar)="guardar()" (descartar)="descartar()">
    <pc-odoo-maestro>
      <div izquierda>
        <div class="o_form_label_row">
          <span class="o_form_label">Código</span>
          @if (nuevo) {
            <input class="form-control form-control-sm o_inline_input" aria-label="Código" data-campo="codigo"
                   [value]="codigo()" (input)="cambiar(codigo, $any($event.target).value)" />
          } @else {
            <span class="o_form_value fw-semibold">{{ codigo() }}</span>
          }
        </div>
        <div class="o_form_label_row">
          <span class="o_form_label">Nombre</span>
          <input class="form-control form-control-sm o_inline_input" aria-label="Nombre" data-campo="nombre"
                 [value]="nombre()" (input)="cambiar(nombre, $any($event.target).value)" />
        </div>
      </div>
      <div derecha>
        <div class="o_form_label_row">
          <span class="o_form_label">Descripción</span>
          <input class="form-control form-control-sm o_inline_input" aria-label="Descripción" data-campo="descripcion"
                 [value]="descripcion()" (input)="cambiar(descripcion, $any($event.target).value)" />
        </div>
        @if (nuevo) {
          <div class="o_form_label_row">
            <span class="o_form_label">Copiar permisos de</span>
            <pc-odoo-many2one nombre="Copiar permisos de" [origen]="origenGrupos()" [aTexto]="textoGrupo" [idDe]="idGrupo"
                              [ngModel]="copiarDe()" (ngModelChange)="copiar($event)" />
          </div>
        }
      </div>
    </pc-odoo-maestro>

    <pc-odoo-tabs [pestanas]="pestanas">
      <ng-template pcPestana="permisos">
        <div class="mb-4">
          <pc-odoo-dual-list [arbol]="arbol()" [seleccionados]="permisos()" (seleccionadosChange)="cambiar(permisos, $event)" />
        </div>
      </ng-template>
    </pc-odoo-tabs>
  </pc-hoja-registro>
}
