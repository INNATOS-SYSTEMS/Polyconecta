<div class="o_control_panel">
  <div class="d-flex align-items-center gap-3">
    <pc-boton-nuevo [ruta]="'/plataforma/grupos'" />
    <pc-odoo-breadcrumb [items]="[{ label: 'Grupos' }]" />
  </div>
  <pc-odoo-search-panel
    [view]="vista()"
    [(texto)]="searchText"
    [(filtrosActivos)]="filtros"
    [(agrupacionesActivas)]="agrupaciones"
    [permiteAgrupar]="true"
    [conFavoritos]="false"
  >
    <pc-odoo-seleccion [lista]="tabla" />
  </pc-odoo-search-panel>
  <div class="d-flex align-items-center gap-2"></div>
</div>

<div class="p-4">
  <pc-odoo-list #tabla [almacenFavoritos]="favoritos" [estadoEnUrl]="true"
    lista="plataforma.grupos"
    [origen]="origen"
    [columnas]="columnas"
    [idDe]="idGrupo"
    [acciones]="acciones"
    mensajeVacio="No hay grupos registrados"
    [(busqueda)]="searchText"
    [(nombrados)]="filtros"
    [(agruparPor)]="agrupaciones"
    (abrir)="abrir($event)"
  />
</div>
