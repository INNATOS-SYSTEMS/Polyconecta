<div class="o_control_panel">
  <div class="d-flex align-items-center gap-3">
    <pc-boton-nuevo [ruta]="'/plataforma/usuarios/nuevo'" />
    <pc-odoo-breadcrumb [items]="[{ label: 'Configuración' }, { label: 'Usuarios' }]" />
  </div>
  <pc-odoo-search-panel
    [view]="vista"
    [(texto)]="searchText"
    [(filtrosActivos)]="filtros"
    [(agrupacionesActivas)]="agrupaciones"
    [permiteAgrupar]="true"
    [conFavoritos]="false"
  />
  <div class="d-flex align-items-center gap-2"></div>
</div>

<div class="p-4">
  <pc-odoo-list
    lista="plataforma.usuarios"
    [origen]="origen"
    [columnas]="columnas"
    [idDe]="idUsuario"
    mensajeVacio="No hay usuarios registrados"
    [(busqueda)]="searchText"
    [(nombrados)]="filtros"
    [(agruparPor)]="agrupaciones"
    (abrir)="abrir($event)"
  />
</div>
