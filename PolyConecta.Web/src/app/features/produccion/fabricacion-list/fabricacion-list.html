<div class="o_control_panel">
    <div class="d-flex align-items-center gap-3">
        <pc-boton-nuevo [ruta]="'/fabricacion'" />
        <pc-odoo-breadcrumb [items]="breadcrumb()" />
    </div>
    <pc-odoo-search-panel [view]="vista" [facetasContexto]="facetas()" [(texto)]="searchText" [(filtrosActivos)]="filtros" [(agrupacionesActivas)]="agrupaciones"
                          [permiteAgrupar]="viewState.viewMode() !== 'Kanban'" [conFavoritos]="viewState.viewMode() !== 'Kanban'"
                          [favoritos]="lista()?.favoritos() ?? []" (guardarFavorito)="lista()?.guardarFavorito($event.nombre, $event.porOmision)"
                          (aplicarFavorito)="lista()?.aplicarFavorito($event)" (borrarFavorito)="lista()?.borrarFavorito($event)" />
    <div class="d-flex align-items-center gap-2">
        <pc-odoo-view-switcher />
    </div>
</div>

<div class="p-4">
    @if (viewState.viewMode() === 'Kanban') {
        <pc-odoo-kanban #kanban [origen]="origen" campoEtapa="estado" [etapas]="etapas" [transiciones]="transiciones" [tarjeta]="tarjeta"
                        [idDe]="idOf" [etapaDe]="etapaOf" [nombrados]="filtros()" [busqueda]="searchText()" [filtros]="filtroPedido()" (abrir)="abrir($event)" />
        <ng-template #tarjeta let-f>
            <div class="fw-bold text-dark small">{{ f.folio }}</div>
            <div class="text-muted small">{{ f.proceso }}</div>
            <div class="badge badge-brand mt-2">{{ f.estado }}</div>
        </ng-template>
        <pc-odoo-pager [count]="kanban.total()" />
    } @else {
        <pc-odoo-list lista="produccion.ordenes" [origen]="origen" [columnas]="columnas()" [idDe]="idOf" mensajeVacio="" [filtros]="filtroPedido()"
                      [(busqueda)]="searchText" [(nombrados)]="filtros" [(agruparPor)]="agrupaciones" (abrir)="abrir($event)" />
    }
</div>

<!-- Cadena de OF: sangría por nivel, flecha en las hijas e insignia "maestra" en la raíz con hijas. En una línea: Razor recorta los espacios. -->
<ng-template #celdaFolio let-f><span [style.margin-left.px]="f.nivel * 26">@if (f.nivel > 0) {<pc-odoo-icon nombre="devolucion" class="text-muted me-1" style="opacity:.55;" />}{{ f.folio }}@if (f.maestra) {<span class="badge bg-secondary-subtle text-secondary-emphasis ms-2" style="font-size:.65rem;">maestra</span>}</span></ng-template>
